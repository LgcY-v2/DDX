# tee_world_candidate_testing · DDNet DDRace server
# Full setting reference: https://ddnet.org/settingscommands/

# Network and public listing
bindaddr "0.0.0.0"
sv_port 8305
sv_register "ipv4"
sv_name "tee_world_candidate_testing"
sv_max_clients 64
sv_max_clients_per_ip 4
sv_high_bandwidth 0
sv_sixup 0

# Standard DDNet DDRace gameplay
sv_map "Tutorial"
sv_gametype "ddnet"
sv_test_cmds 0
sv_ddrace_rules 1
sv_map_vote 1
sv_map_vote_catalog 1
sv_map_warehouse_index "/srv/tee_world_candidate_testing/warehouse/index/maps-v1.tsv"
sv_map_warehouse_archive "/srv/tee_world_candidate_testing/warehouse/archive/maps.7z"
sv_map_warehouse_delta "/srv/tee_world_candidate_testing/warehouse/delta"
sv_map_warehouse_extractor "/srv/tee_world_candidate_testing/warehouse/tools/7zip-26.00/usr/lib/7zip/7za"
sv_map_warehouse_state "state/map-warehouse-collections.tsv"
sv_map_warehouse_cache "maps/warehouse"
sv_map_warehouse_cache_megabytes 2048
sv_map_warehouse_cache_maps 256
sv_shutdown_when_empty 0
sv_max_afk_time 0

# Public-server safeguards
sv_spamprotection 1
sv_vote_kick 1
sv_vote_kick_min 2
sv_vote_kick_bantime 5
sv_vote_kick_delay 60
sv_vote_spectate 0
sv_rcon_max_tries 5
sv_rcon_bantime 30

# Keep scores local; do not connect to an external database.
sv_use_sql 0
sv_sqlite_file "state/ddnet-server.sqlite"

# Runtime logging and dashboard administration
logfile "logs/ddnet-server.log"
logappend 1
loglevel 0
stdout_output_level 0
sv_input_fifo "run/ddnet-server.fifo"
sv_tee_historian 0

sv_motd "tee_world_candidate_testing\nBrowse current maps or search 55,250 historical names under Call vote."
sv_welcome "Browse maps under Call vote. Use /search for the historical archive; its guide is in Map Archive."

# Keep join and administrator credentials outside tracked configuration.
exec secrets.cfg
