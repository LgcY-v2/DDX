# tee_world_candidate_testing · DDNet DDRace server
# Full setting reference: https://ddnet.org/settingscommands/

# Network and public listing
bindaddr "0.0.0.0"
sv_port 8305
sv_register "ipv4"
sv_name "tee_world_candidate_testing"
sv_max_clients 64
sv_max_clients_per_ip 4
sv_high_bandwidth 0
sv_sixup 0

# Standard DDNet DDRace gameplay
sv_map "Tutorial"
sv_gametype "ddnet"
sv_test_cmds 0
sv_ddrace_rules 1
sv_map_vote 1
sv_map_vote_catalog 1
sv_shutdown_when_empty 0
sv_max_afk_time 0

# Public-server safeguards
sv_spamprotection 1
sv_vote_kick 1
sv_vote_kick_min 2
sv_vote_kick_bantime 5
sv_vote_kick_delay 60
sv_vote_spectate 0
sv_rcon_max_tries 5
sv_rcon_bantime 30

# Keep scores local; do not connect to an external database.
sv_use_sql 0
sv_sqlite_file "state/ddnet-server.sqlite"

# Runtime logging and dashboard administration
logfile "logs/ddnet-server.log"
logappend 1
loglevel 0
stdout_output_level 0
sv_input_fifo "run/ddnet-server.fifo"
sv_tee_historian 0

sv_motd "tee_world_candidate_testing\nBrowse DDRace and Gores maps under Call vote."
sv_welcome "Browse maps under Call vote. Reopen Call vote after choosing a folder if your client closes the menu."

# Keep join and administrator credentials outside tracked configuration.
exec secrets.cfg
